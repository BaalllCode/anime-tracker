<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        
        <!-- Header Principal -->
        <header>
            <a href="index.html" class="logo-link">
                <h1>Marathon Tracker</h1>
            </a>
        </header>

        <!-- Botão para voltar atrás -->
        <a href="index.html" class="back-button">&larr; Back to Search</a>

        <!-- Contentor dos Detalhes da Série -->
        <section id="showDetails" class="details-box">
            <p style="text-align: center; width: 100%;">Loading show details...</p>
        </section>

        <!-- Nova Secção: Recomendados (Como pediste) -->
        <h2 class="section-title">Similar TV Shows</h2>
        <section id="recommendedContainer" class="results-grid">
            <!-- JavaScript will inject cards here -->
        </section>

    </main>
    
    <script src="details.js"></script>
</body>
</html>
