<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Show Marathon Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        
        <!-- Header -->
        <header>
            <a href="index.html" class="logo-link">
                <h1>Marathon Tracker</h1>
            </a>
            <p>Search for a TV show to calculate the total marathon time.</p>
        </header>

        <!-- Search Area -->
        <section class="search-section">
            <input type="text" id="searchInput" placeholder="e.g., Breaking Bad..." autocomplete="off">
            <button id="searchBtn">Search</button>
        </section>

        <h2 id="sectionTitle" class="section-title">Recommended for you</h2>

        <!-- Results Grid -->
        <section id="resultsContainer" class="results-grid"></section>

    </main>
    
    <script src="script.js"></script>
</body>
</html>
